<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding-right: 5%;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('https://thumbs.dreamstime.com/z/coffee-mug-background-vector-illustration-copyspace-33949822.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .container {
      padding: 30px;
      width: 100%;
      max-width: 400px;
      color: rgb(22,17,15);
    }

    h1 {
      text-align: left;
      margin-bottom: 20px;
    }

    form {
      margin-top: 10px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #101010;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #faf5f5;
    }

    input:focus {
      border-color: #ff7b00;
      outline: none;
      box-shadow: 0 0 5px rgba(255, 123, 0, 0.5);
    }

    button {
      background: linear-gradient(to right, #ff7b00, #ff4500);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(to right, #ff4500, #ff7b00);
    }

    p {
      text-align: left;
      margin-top: 15px;
    }

    a {
      color: #ff7b00;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="background"></div>
  <div class="container">
    <h1>Log In</h1>
    <form id="loginForm">
      <label for="name">Username:</label>
      <input type="text" id="name" name="name" placeholder="Enter your username" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit">Log in</button>
    </form>
    <p>Don't have an account? <a href="Signup.html">Sign Up</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3001/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password }),
        });

        const result = await response.json();
        console.log('🟢 Server Response:', result);

        if (response.ok) {
          alert('✅ Login successful! Redirecting...');
          window.location.href = result.redirectUrl || 'index.html';
        } else {
          alert(`❌ ${result.message || 'Login failed'}`);
        }
      } catch (error) {
        alert('❌ Failed to connect to the server. Please check if backend is running.');
        console.error(error);
      }
    });
  </script>
</body>

</html>
