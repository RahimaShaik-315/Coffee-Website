
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0 5%;
            box-sizing: border-box;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://thumbs.dreamstime.com/z/coffee-mug-background-vector-illustration-copyspace-33949822.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        .container {
            padding: 30px;
            width: 100%;
            max-width: 400px;
            color: rgb(22, 17, 15);
        }

        h1 {
            text-align: left;
            margin-bottom: 20px;
        }

        form {
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #101010;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #faf5f5;
        }

        input:focus {
            border-color: #ff7b00;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 123, 0, 0.5);
        }

        button {
            background: linear-gradient(to right, #ff7b00, #ff4500);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #ff4500, #ff7b00);
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="container">
        <h1>Sign Up</h1>

        <form id="signupForm">

            <label for="fullName">Full Name:</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="name"
                placeholder="Choose a username"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit" id="signupButton">
                Sign Up
            </button>

            <p class="error-message" id="errorMessage"></p>

        </form>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');
        const signupButton = document.getElementById('signupButton');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMessage.textContent = '';
            signupButton.disabled = true;
            signupButton.textContent = 'Creating Account...';

            const formData = {
                fullName: form.fullName.value.trim(),
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value
            };

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Registration successful! Please log in.');

                    window.location.href = '/';
                } else {
                    errorMessage.textContent =
                        data.message || 'Signup failed. Try again.';
                }

            } catch (error) {
                console.error('Signup error:', error);

                errorMessage.textContent =
                    'Unable to connect to the server. Please try again.';
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = 'Sign Up';
            }
        });
    </script>

</body>
</html>
